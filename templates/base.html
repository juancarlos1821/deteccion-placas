<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PlacaScan · lector de placas{% endblock %}</title>
    <meta name="description" content="Sube la foto de un vehículo y lee su placa. YOLOv8 la localiza y PaddleOCR transcribe los caracteres.">

    <!-- Tailwind sigue cargado porque las pantallas internas (historial,
         reportes) lo usan. El diseño de la demo va en CSS propio. -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ------------------------------------------------------------------
           Paleta: un taller de inspección vehicular, no una demo de IA.
           Gris galvanizado de fondo, blanco de placa para las superficies y
           el azul de la franja de las placas peruanas como acento estructural.
           El verde aparece en un solo sitio: cuando hay lectura confirmada.
           ------------------------------------------------------------------ */
        :root {
            --ambiente: #e4e8ea;
            --ambiente-hondo: #d3d9dd;
            --superficie: #ffffff;
            --tinta: #14171a;
            --tinta-suave: #5d666c;
            --azul: #1b4fa0;
            --azul-hondo: #143a76;
            --verde: #0f7a52;
            --linea: #c6ccd1;
            --alerta: #a33417;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--ambiente);
            color: var(--tinta);
            font-family: Archivo, system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--azul);
            outline-offset: 3px;
            border-radius: 2px;
        }

        /* --- Barra superior ------------------------------------------------ */
        .barra {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.9rem 1.25rem;
            background: var(--superficie);
            border-bottom: 1px solid var(--linea);
        }

        .marca {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        /* El logotipo es una placa en miniatura: la misma pieza que el
           resultado, reducida. */
        .marca-placa {
            display: inline-flex;
            align-items: stretch;
            height: 30px;
            border: 1.5px solid var(--tinta);
            border-radius: 5px;
            overflow: hidden;
            background: var(--superficie);
        }

        .marca-tira {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 17px;
            background: var(--azul);
            color: #fff;
            font-family: "Saira Condensed", sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
        }

        .marca-texto {
            display: flex;
            align-items: center;
            padding: 0 0.5rem;
            font-family: "Saira Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.06em;
        }

        .barra-enlace {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--linea);
            border-radius: 999px;
            font-size: 0.9rem;
            text-decoration: none;
            color: var(--tinta-suave);
            transition: border-color .15s, color .15s;
        }

        .barra-enlace:hover {
            border-color: var(--azul);
            color: var(--azul);
        }

        /* --- Contenedor ---------------------------------------------------- */
        .lienzo {
            flex: 1;
            width: 100%;
            max-width: 62rem;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
        }

        /* --- Pie ------------------------------------------------------------ */
        .pie {
            padding: 1.25rem;
            border-top: 1px solid var(--linea);
            font-size: 0.85rem;
            color: var(--tinta-suave);
            text-align: center;
        }

        .pie a { color: var(--azul); }

        @media (min-width: 640px) {
            .barra { padding: 1rem 2rem; }
            .lienzo { padding: 3.5rem 2rem 5rem; }
        }
    </style>
    {% block estilos %}{% endblock %}
</head>

<body>
    <header class="barra">
        <a class="marca" href="{{ url_for('subir') }}">
            <span class="marca-placa" aria-hidden="true">
                <span class="marca-tira">PE</span>
                <span class="marca-texto">PLACASCAN</span>
            </span>
            <span class="sr-only">PlacaScan, inicio</span>
        </a>

        <a class="barra-enlace" href="https://github.com/juancarlos1821/deteccion-placas" target="_blank" rel="noopener noreferrer">
            Ver código
        </a>
    </header>

    <main class="lienzo">
        {% block content %}{% endblock %}
    </main>

    <footer class="pie">
        Demo de <a href="https://github.com/juancarlos1821" target="_blank" rel="noopener noreferrer">Juan Carlos Mocsup</a>.
        Detección con YOLOv8, lectura con PaddleOCR, inferencia sobre ONNX Runtime.
    </footer>
</body>

</html>
